<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Free backpack checklist · Rayzki</title>
  <meta name="description" content="Free one-page Before you leave checklist for kids. A4 and US Letter PDF." />
  <style>
    :root {
      --cream: #f4efe6;
      --ink: #1a2433;
      --orange: #c45a24;
      --rule: #c8b8a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background: #efe6d8;
      color: var(--ink);
      line-height: 1.45;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    .kicker {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.55rem;
      margin-bottom: 1.1rem;
    }
    .kicker span:last-child { color: var(--orange); font-weight: 600; }
    h1 {
      font-family: "Libre Caslon Text", "Georgia", serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 5vw, 2.15rem);
      margin: 0 0 0.35rem;
      line-height: 1.15;
    }
    .sub { margin: 0 0 1.4rem; color: #4a5568; font-size: 0.98rem; }
    .preview {
      width: 100%;
      height: auto;
      border: 1px solid var(--rule);
      background: #fff;
      margin: 0 0 1.35rem;
      display: block;
    }
    .actions { display: grid; gap: 0.65rem; margin-bottom: 1.5rem; }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: var(--ink);
      padding: 0.85rem 1rem;
      border-radius: 2px;
      font-size: 0.95rem;
    }
    a.btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--ink);
    }
    .note { font-size: 0.85rem; color: #5a6570; margin: 0 0 1.25rem; }
    footer {
      font-size: 0.8rem;
      color: #5a6570;
      border-top: 1px solid var(--rule);
      padding-top: 0.85rem;
    }
    footer a { color: var(--orange); }
  </style>
</head>
<body>
  <main>
    <div class="kicker"><span>Rayzki · out the door</span><span>Free sample</span></div>
    <h1>Before you leave</h1>
    <p class="sub">Tick each one · hang by the door. School bag, lunch box, water bottle, shoes.</p>
    <img class="preview" src="checklist-preview.jpg" width="900" height="1273" alt="Preview of the free Before you leave checklist: school bag, lunch box, water bottle and shoes, each with a tick box" />
    <div class="actions">
      <a class="btn" href="free-sample-backpack-checklist-A4.pdf" download>Download A4 PDF</a>
      <a class="btn secondary" href="free-sample-backpack-checklist-US-Letter.pdf" download>Download US Letter PDF</a>
    </div>
    <p class="note">Personal use. Full 6-page set with cut-out cards is on Etsy.</p>
    <footer>
      Free sample · Full set:
      <a href="https://www.etsy.com/shop/Rayzki">rayzki.etsy.com</a>
    </footer>
  </main>
</body>
</html>
